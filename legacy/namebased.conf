# Virtualhost for the simulation project 18/06/2014
<VirtualHost 141.161.151.92:80>
	ServerName evolutiongenetics.georgetown.edu
	ServerAlias *.evolutiongenetics.georgetown.edu
	LogLevel debug
	#DocumentRoot /var/www/populationgenetics
	#ErrorLog logs/evolutiongenetics.georgetown.edu_error_log
	#TransferLog logs/evolutiongenetics.georgetown.edu_access_log
	WSGIApplicationGroup %{GLOBAL}
        WSGIDaemonProcess evolutiongenetics python-path=/var/www/populationgenetics-env/lib/python2.6/site-packages
        WSGIProcessGroup evolutiongenetics

        <Directory "/var/www/populationgenetics/src/populationgenetics/">
	    Options -Indexes FollowSymLinks
            AllowOverride AuthConfig FileInfo
            Order allow,deny
            Allow from all
        </Directory>        
        
        <Files /var/www/populationgenetics/src/populationgenetics/wsgi.py>
	    SetEnv PROCESS_GROUP evolutiongenetics
        </Files> 

        WSGIScriptAlias / /var/www/populationgenetics/src/populationgenetics/wsgi.py

    	AliasMatch ^/([^/]*\.css) /var/www/populationgenetics/src/simulations/static/styles/$1
	Alias /static/ /var/www/populationgenetics/src/simulations/static/
	
	<Directory /var/www/populationgenetics/src/simulations/static>
		Order deny,allow
		Allow from all	
	</Directory>

</VirtualHost>
